# CI на ВМ-раннерах Gitea (задача 00345091, подзадача П4).
# Host-mode: джобы выполняются шеллом в ВМ (без docker).
# GitHub Actions (ci.yml) остаётся на hosted-раннерах для main — не трогаем.
#
# Джобы сериализованы намеренно: linux-vm и win-vm живут на одном физическом
# NVMe, и их одновременная тяжёлая работа даёт многоминутные IO-столлы гостей
# (ошибка 68a395b5: файлы серверных тестов по 3 с снимались по таймауту 120 с,
# а `tsc` на win-vm шёл 15 минут вместо 58 с). Пока нет отдельных дисков,
# последовательный запуск — единственный детерминированный способ убрать
# конкуренцию; `if: always()` сохраняет независимость результата Linux-джобы
# от исхода Windows.
name: Gitea CI

on:
  push:
    branches: ['releases/**', 'main']
  pull_request:

jobs:
  windows:
    name: Windows (win-vm)
    runs-on: win-vm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build @etn/shared
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Server tests
        run: npm -w @etn/server test

      - name: Client tests
        run: npm -w @etn/client test

  linux:
    name: Linux (linux-vm)
    runs-on: linux-vm
    # Сериализация с Windows-джобой — см. комментарий в шапке файла.
    # `always()` — Linux отрабатывает и при красной Windows-джобе.
    needs: [windows]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build @etn/shared
        run: npm run build:shared

      - name: Typecheck
        run: npm run typecheck

      # Ресурсы раннера в лог: разбор таймаутов серверных тестов (ошибка
      # 68a395b5) требует знать реальные CPU/RAM/диск и IO-давление ВМ.
      - name: Runner resources
        run: |
          nproc
          node -p "require('os').availableParallelism()"
          free -m
          df -h /opt /tmp
          uptime
          cat /proc/pressure/io || true

      - name: Server tests
        run: npm -w @etn/server test
