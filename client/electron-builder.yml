# electron-builder configuration for the ETN desktop client (task K1,
# docs/07-client-electron.md §9).
#
# Build: `npm -w @etn/client run package` (electron-vite build + electron-builder).

appId: dev.etn.app
productName: ETN
# Pinned to the same version as devDependencies.electron — electron-builder
# cannot detect the version from node_modules when electron is hoisted to the
# workspace root (npm workspaces), so it must be stated explicitly.
electronVersion: 31.7.7
directories:
  output: release
  buildResources: build

# electron-vite outputs to `out/`; pack main/preload/renderer from there.
files:
  - out/**/*
  - package.json

# Local SQLite migrations live outside the asar so `fs.readdirSync` can load
# them at runtime: main resolves them as `<resources>/migrations` in packaged
# builds (see defaultMigrationsDir in src/main/db/paths.ts).
extraResources:
  - from: migrations
    to: migrations

# Native module — rebuilt for Electron ABI by electron-builder automatically.
asarUnpack:
  - '**/*.node'

# Windows: NSIS installer.
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

# macOS: dmg (arm64 + x64), hardened runtime for update signing.
mac:
  target:
    - dmg
  category: public.app-category.productivity
  notarize: false

# Linux: AppImage + deb.
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: В. Зайцев <nerkuda@users.noreply.github.com>
  # Default artifact name uses the npm package name (@etn/client) which
  # breaks the deb output path; the executable name must also be filesystem-
  # and desktop-friendly.
  artifactName: ${productName}-${version}.${ext}
  executableName: etn

# Auto-update source (task K4): GitHub Releases. The updater only acts in
# packaged builds; DEV_MODE builds skip checks.
publish:
  provider: github
  owner: nerkuda
  repo: e-tho-net
