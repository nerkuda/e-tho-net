# electron-builder configuration for the ETN desktop client (task K1,
# docs/07-client-electron.md §9).
#
# Build: `npm -w @etn/client run package:dir` — распакованный каталог
# release/win-unpacked для установщика Inno Setup (задача 98ad5eec).
# `npm -w @etn/client run package` остаётся общей сборкой (macOS/Linux).

appId: dev.etn.app
productName: ETN
# Pinned to the same version as devDependencies.electron — electron-builder
# cannot detect the version from node_modules when electron is hoisted to the
# workspace root (npm workspaces), so it must be stated explicitly.
electronVersion: 31.7.7
directories:
  output: release
  buildResources: build

# electron-vite outputs to `out/`; pack main/preload/renderer from there.
files:
  - out/**/*
  - package.json

# Local SQLite migrations live outside the asar so `fs.readdirSync` can load
# them at runtime: main resolves them as `<resources>/migrations` in packaged
# builds (see defaultMigrationsDir in src/main/db/paths.ts).
# THIRD-PARTY-NOTICES.txt is generated by `npm run notices` (the `prepackage`
# script runs it before packaging) into build/ and shipped next to the app.
extraResources:
  - from: migrations
    to: migrations
  - from: build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt

# Native module — rebuilt for Electron ABI by electron-builder automatically.
asarUnpack:
  - '**/*.node'

# Windows: только распакованный каталог (`dir`). Установщик Windows — Inno
# Setup (installer/etn.iss), NSIS-цель снята задачей 98ad5eec: один установщик
# на платформу, без второго экземпляра «Программы и компоненты».
# electron-builder складывает dir-сборку в release/win-unpacked — её и берёт
# installer/fetch-payload.ps1 в payload/client.
win:
  target:
    - dir

# macOS: dmg (arm64 + x64), hardened runtime.
mac:
  target:
    - dmg
  category: public.app-category.productivity
  notarize: false

# Linux: AppImage + deb.
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: В. Зайцев (aka Nerkuda) <nerkuda@users.noreply.github.com>
  # Default artifact name uses the npm package name (@etn/client) which
  # breaks the deb output path; the executable name must also be filesystem-
  # and desktop-friendly.
  artifactName: ${productName}-${version}.${ext}
  executableName: etn
