# Release pipeline (task K3): on a version tag, build installers for all three
# desktop platforms and publish a server Docker image to GHCR.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  client:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Package with electron-builder
        # `--publish never`: artifacts are attached to the release by the
        # github-release job below, not by electron-builder itself.
        run: npm -w @etn/client run package -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: etn-${{ matrix.os }}
          path: client/release/*
          if-no-files-found: error

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/etn-server:${{ github.ref_name }}

  github-release:
    needs: [client, server-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: the notes step reads the previous tag and the
          # annotated tag message.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Only the client installers: the tiny `*.dockerbuild` metadata
          # artifact of build-push-action must not reach the release.
          pattern: etn-*
          merge-multiple: true
      - name: Prepare release notes
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prev_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          title="$(git tag -l --format='%(contents:subject)' "${tag}")"
          if [ -z "${title}" ]; then title="ETN ${version}"; fi
          args=(--version "${version}" --out release-body.md)
          if [ -n "${prev_tag}" ]; then args+=(--prev-tag "${prev_tag}"); fi
          node server/scripts/release-notes.mjs "${args[@]}"
          echo "name=${title}" >> "${GITHUB_OUTPUT}"
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: release-body.md
          files: |
            artifacts/*
