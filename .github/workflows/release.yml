# Релизный конвейер ETN (задачи 6d93fe6f, 0.15.1; ae122f1d, 0.15.2).
#
# На тег `vX.Y.Z` (или на ручной запуск с указанием тега) workflow собирает
# ассеты релиза и публикует GitHub Release:
#
#   ETN-Setup-<version>.exe               — установщик Windows (Inno Setup, installer/build.ps1);
#   ETN-Client-<version>-linux-x64.tar.gz — распакованный клиент Linux (electron-builder --dir);
#   etn-server-<version>.tar.gz           — серверная поставка Linux (server/scripts/build-server-tarball.mjs);
#   SHA256SUMS                            — SHA-256 всех трёх бинарных ассетов;
#   install.sh                            — установщик Linux-клиента (не хешируется: это скрипт).
#
# Имена и состав ассетов — контракт (карточка 6d93fe6f, требование d9e2dcf8):
# по ним строятся install.sh, client_sha256 в GET /version и серверное
# обновление (server/src/update/checker.ts ищет `ETN-Setup-<version>.exe`
# и файл `SHA256SUMS`). Пропуск любого ассета — падение workflow, а не
# «релиз без файла».
#
# Канал prerelease/stable. Канал выводится из тега: версия с prerelease-суффиксом
# (`v0.15.1-rc.1`) публикуется предварительным релизом (`prerelease: true`,
# `make_latest: false`), чистая версия (`v0.15.1`) — стабильным. Ручной запуск
# (workflow_dispatch) может переопределить канал входом `channel`: `auto` —
# по тегу, `prerelease` или `stable` — принудительно. Тег для ручного запуска
# обязан начинаться с `v` — install.sh строит URL ассета как
# `.../releases/download/v<версия>/<asset>`. Повторный ручной запуск с другим
# каналом переводит релиз в другой канал — ассеты перезаписываются, а не
# дублируются.
#
# Docker-образ сервера — обязательная часть релиза (задача ae122f1d): джоба
# `docker-image` вызывает переиспользуемый `.github/workflows/docker-image.yml`
# и публикует `ghcr.io/<repo>/etn-server:<tag>`. `publish` зависит от неё,
# поэтому релиз без образа не выпускается. Образ для уже вышедшего тега
# доопубликовывается ручным запуском `docker-image.yml` (workflow_dispatch),
# без пересборки остальных ассетов.
#
# macOS DMG в поставку версии не входит (границы компонента f4c02ddd).

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза с префиксом v (vX.Y.Z или vX.Y.Z-rc.1)'
        required: true
        type: string
      channel:
        description: 'Канал: auto — из тега (суффикс → prerelease), stable или prerelease'
        required: false
        type: choice
        options:
          - auto
          - stable
          - prerelease
        default: auto

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  # Версия и канал релиза — единственный источник для имён ассетов ниже.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      make_latest: ${{ steps.resolve.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve version and channel
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          CHANNEL_INPUT: ${{ inputs.channel || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          # install.sh строит URL ассета как .../releases/download/v<версия>/<asset>:
          # тег без v сделал бы релиз невидимым для установщика.
          case "${tag}" in
            v*) ;;
            *)
              echo "::error::тег ${tag} должен начинаться с v: vX.Y.Z (сюда же vX.Y.Z-rc.1)"
              exit 1
              ;;
          esac
          version="${tag#v}"
          if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "::error::тег ${tag} не соответствует схеме vX.Y.Z"
            exit 1
          fi
          package_version="$(node -p "require('./server/package.json').version")"
          if [ "${package_version}" != "${version}" ]; then
            echo "::error::версия в server/package.json (${package_version}) не совпадает с тегом ${tag}"
            exit 1
          fi
          # Канал выводится из тега: prerelease-суффикс (`-rc.1`, `-beta.2`) —
          # предварительный релиз без метки latest, чистая версия — стабильный.
          case "${version}" in
            *-*) tag_prerelease=true ;;
            *) tag_prerelease=false ;;
          esac
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${CHANNEL_INPUT:-auto}" in
              auto) prerelease="${tag_prerelease}" ;;
              prerelease) prerelease=true ;;
              stable) prerelease=false ;;
              *)
                echo "::error::неизвестный канал ${CHANNEL_INPUT}: ожидается auto, stable или prerelease"
                exit 1
                ;;
            esac
          else
            prerelease="${tag_prerelease}"
          fi
          if [ "${prerelease}" = "true" ]; then
            make_latest=false
          else
            make_latest=true
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
          echo "make_latest=${make_latest}" >> "${GITHUB_OUTPUT}"
          echo "версия ${version}, prerelease=${prerelease}, make_latest=${make_latest}"

  windows-installer:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # -RefreshPayload готовит Node 22, prod-зависимости, службу WinSW и
          # клиентскую часть payload (задачи 8b1f5980, 98ad5eec), после чего
          # build.ps1 проверяет свежесть payload и компилирует .iss.
          pwsh -File installer/build.ps1 -Version $env:VERSION -RefreshPayload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer asset
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $exe = "release/ETN-Setup-$($env:VERSION).exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "нет ассета $exe" }
          if ((Get-Item -LiteralPath $exe).Length -le 0) { throw "ассет $exe пуст" }
          Write-Host "OK: $exe"
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/ETN-Setup-*.exe
          if-no-files-found: error

  linux-client:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - run: npm run build:shared
      - name: Build unpacked client
        # Цель `dir`: отдельный установщик NSIS из electron-builder снимается
        # (98ad5eec), Linux-клиент поставляется распакованным каталогом.
        run: npm -w @etn/client run package -- --dir --publish never
      - name: Pack client tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          unpacked="client/release/linux-unpacked"
          if [ ! -x "${unpacked}/etn" ]; then
            echo "::error::electron-builder не создал ${unpacked}/etn"
            ls -la client/release || true
            exit 1
          fi
          # Иконка для ярлыка рабочего стола: install.sh берёт etn.png из
          # каталога установленной версии, если он есть.
          cp client/build/icon.png "${unpacked}/etn.png"
          asset="ETN-Client-${VERSION}-linux-x64.tar.gz"
          mkdir -p dist
          tar --owner=0 --group=0 --numeric-owner -czf "dist/${asset}" -C "${unpacked}" .
          if [ ! -s "dist/${asset}" ]; then
            echo "::error::ассет dist/${asset} не создан"
            exit 1
          fi
          echo "OK: dist/${asset} ($(du -h "dist/${asset}" | cut -f1))"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-client
          path: dist/ETN-Client-*-linux-x64.tar.gz
          if-no-files-found: error

  linux-server:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install
      - run: npm run build:shared
      - run: npm -w @etn/server run build
      - name: Build server tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Скрипт сам проверяет состав архива и прогоняет smoke-test:
          # etn init + запуск сервера + GET /api/v1/health.
          node server/scripts/build-server-tarball.mjs --version "${VERSION}" --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux-server
          path: dist/etn-server-*.tar.gz
          if-no-files-found: error

  # Docker-образ сервера — обязательный артефакт релиза: `publish` ждёт эту
  # джобу. Права задаются здесь, потому что reusable workflow может только
  # сузить набор, переданный вызывающей джобой.
  docker-image:
    # Версия/тег проверяются джобой version: при её падении образ не должен
    # уехать в GHCR сиротой для релиза, который не выйдет.
    needs: [version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      # Код образа — коммит релиза, а не тег: при prerelease через
      # workflow_dispatch тега ещё нет (его создаёт publish), и checkout по
      # tag падал бы (ошибка dd38a306). github.sha — тот же коммит, на который
      # publish ставит target_commitish.
      source_ref: ${{ github.sha }}

  publish:
    needs: [version, windows-installer, linux-client, linux-server, docker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.ref }}
          # Полная история и теги: заголовок берётся из аннотации тега,
          # compare-ссылка — из предыдущего тега.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate and verify SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          expected=(
            "ETN-Setup-${VERSION}.exe"
            "etn-server-${VERSION}.tar.gz"
            "ETN-Client-${VERSION}-linux-x64.tar.gz"
          )
          for name in "${expected[@]}"; do
            if [ ! -s "${name}" ]; then
              echo "::error::в релизе нет обязательного ассета ${name}"
              ls -la
              exit 1
            fi
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          if [ "$(wc -l < SHA256SUMS)" -ne "${#expected[@]}" ]; then
            echo "::error::SHA256SUMS покрывает не все ассеты"
            cat SHA256SUMS
            exit 1
          fi
          for name in "${expected[@]}"; do
            if ! awk -v asset="${name}" 'length($1) == 64 && $2 == asset { found = 1 } END { exit found ? 0 : 1 }' SHA256SUMS; then
              echo "::error::в SHA256SUMS нет строки для ${name}"
              exit 1
            fi
          done
          echo "OK: SHA256SUMS"
          cat SHA256SUMS
      - name: Prepare release notes
        id: notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Тег пуша уже существует; при ручном запуске его может ещё не быть —
          # тогда предыдущий релиз ищем от HEAD, а тег создаст публикация.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          else
            prev_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          fi
          title="$(git tag -l --format='%(contents:subject)' "${TAG}")"
          if [ -z "${title}" ]; then title="ETN ${VERSION}"; fi
          args=(--version "${VERSION}" --out release-body.md)
          if [ -n "${prev_tag}" ]; then args+=(--prev-tag "${prev_tag}"); fi
          node server/scripts/release-notes.mjs "${args[@]}"
          echo "name=${title}" >> "${GITHUB_OUTPUT}"
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.name }}
          body_path: release-body.md
          prerelease: ${{ needs.version.outputs.prerelease }}
          make_latest: ${{ needs.version.outputs.make_latest }}
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/*
            scripts/install.sh
