# Release pipeline (task K3): on a version tag, build installers for all three
# desktop platforms and publish a server Docker image to GHCR.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  client:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Package with electron-builder
        # `--publish never`: artifacts are attached to the release by the
        # github-release job below, not by electron-builder itself.
        run: npm -w @etn/client run package -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: etn-${{ matrix.os }}
          path: client/release/*
          if-no-files-found: error

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/etn-server:${{ github.ref_name }}

  github-release:
    needs: [client, server-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Only the client installers: the tiny `*.dockerbuild` metadata
          # artifact of build-push-action must not reach the release.
          pattern: etn-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
