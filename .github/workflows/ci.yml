name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Caches ~/.npm based on package-lock.json.
          cache: 'npm'

      - name: Install dependencies
        # npm install (not ci) — lockfile may be stale or absent at project start.
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        # No tests yet — placeholder keeps the pipeline green.
        run: echo "tests TBD"
