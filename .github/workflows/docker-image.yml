# Сборка и публикация Docker-образа сервера в GHCR (задача ae122f1d, 0.15.2).
#
# Образ — обязательная часть релиза: release.yml вызывает этот workflow
# джобой `docker-image`, а джоба `publish` зависит от неё и без успешной
# публикации образа не выпускает релиз.
#
# Workflow переиспользуемый (`workflow_call`) и запускается вручную
# (`workflow_dispatch`) — так можно доопубликовать образ для уже вышедшего
# тега, не пересобирая остальные ассеты. Вход `tag` — единственный источник
# и кода (checkout по тегу), и тега образа. Тег `latest` намеренно не
# ставится: образ адресуется только версией.
#
# Права: `contents: read` — чтение репозитория по тегу; `packages: write` —
# пуш в GHCR от имени `github.actor` с `GITHUB_TOKEN` (вызывающая джоба
# обязана передать те же права, иначе reusable workflow получит урезанный
# набор).

name: docker-image

on:
  workflow_call:
    inputs:
      tag:
        description: 'Тег релиза с префиксом v (vX.Y.Z или vX.Y.Z-rc.1)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза с префиксом v (vX.Y.Z или vX.Y.Z-rc.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/etn-server:${{ inputs.tag }}
