# ETN self-hosted deployment (task K2, docs/install-server.md §6).
#
#   docker compose up -d
#   docker compose run --rm --entrypoint node etn /app/server/dist/cli.js init --username admin --display-name Admin
#
# Образ собирается целью `server` (HTTP): Dockerfile также умеет `mcp` — stdio-
# образ MCP-сервера, он запускается не compose-сервисом, а MCP-клиентом:
#   docker run --rm -i -v etn_data:/data nerkuda/etn-mcp:vX.Y.Z
# Тег `latest` не публикуется: при публикации укажите версию явно.

services:
  etn:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: server
    ports:
      - '4321:4321'
    environment:
      ETN_DATA_DIR: /data
      # В образе уже ETN_HOST=0.0.0.0 и ETN_PORT=4321; переменные оставлены
      # как явный пример настройки.
      ETN_HOST: 0.0.0.0
      ETN_PORT: '4321'
      ETN_LOG_LEVEL: info
      # ETN_MCP_ENABLED: "1"
    volumes:
      - etn_data:/data
    restart: unless-stopped

volumes:
  etn_data:
