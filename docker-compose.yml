# ETN self-hosted deployment (task K2, docs/install-server.md §6).
#
#   docker compose up -d
#   docker compose run --rm etn node /app/server/dist/cli.js init --username admin --display-name Admin

services:
  etn:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '4321:4321'
    environment:
      ETN_DATA_DIR: /data
      ETN_HOST: 0.0.0.0
      ETN_PORT: '4321'
      ETN_LOG_LEVEL: info
      # ETN_MCP_ENABLED: "1"
    volumes:
      - etn_data:/data
    restart: unless-stopped

volumes:
  etn_data:
